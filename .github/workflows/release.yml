name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: wails build -clean -platform windows/amd64
        env:
          # Avoid interactive prompts in CI
          CGO_ENABLED: "1"

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $outDir = "release-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Copy-Item "build\bin\ApiTester.exe" "$outDir\ApiTester.exe"

          $zipName = "ApiTester-windows-amd64-$version.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$outDir\*" -DestinationPath $zipName

          # Keep a versioned exe name for direct download
          Copy-Item "build\bin\ApiTester.exe" "ApiTester-windows-amd64-$version.exe"

          Get-ChildItem $zipName, "ApiTester-windows-amd64-$version.exe" | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ApiTester-windows-amd64-*.zip
            ApiTester-windows-amd64-*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
