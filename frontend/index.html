<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ApiTester</title>
  <link rel="icon" href="./src/assets/images/appicon.svg" type="image/svg+xml"/>
</head>
<body>
  <div id="app" class="app doc-mode">
    <!-- top bar -->
    <header class="bar">
      <select id="project" class="select project" title="项目"></select>
      <div id="envWrap" class="env-wrap">
        <select id="barEnv" class="select bar-env" title="环境"></select>
        <button id="btnEnvMore" class="btn ghost bar-btn btn-icon env-more" type="button" title="环境菜单" aria-label="环境菜单" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <div id="envEdit" class="env-edit hidden">
          <div class="env-edit-head">
            <span>变量</span>
            <span id="envEditName" class="env-edit-name"></span>
          </div>
          <div class="vars-hint">host 固定，对应顶部地址。其它名字写 Token，在 URL / 头 / 体里用 {{Token}}</div>
          <div id="varRows" class="kv-list"></div>
        </div>
      </div>
      <button id="btnAddProfile" class="btn ghost bar-btn btn-icon btn-add-profile" type="button" title="增加地址" aria-label="增加地址">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.75v10.5M2.75 8h10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btnDelProfile" class="btn ghost bar-btn btn-icon btn-del-profile" type="button" title="删除当前地址" aria-label="删除当前地址" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.25 4.5h9.5M6.4 4.5V3.45c0-.5.4-.9.9-.9h1.4c.5 0 .9.4.9.9V4.5M5.15 4.5l.55 8.05c.06.7.64 1.2 1.34 1.2h2.02c.7 0 1.28-.5 1.34-1.2l.55-8.05M7.1 6.7v4.2M8.9 6.7v4.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="urlWrap" class="url-wrap">
        <div id="urlBox" class="url-box">
          <span id="urlPrefix" class="url-prefix hidden" aria-hidden="true"></span>
          <input id="url" class="input url" type="text" spellcheck="false" readonly
                 placeholder="点击 + 填写地址"/>
        </div>
      </div>
      <input id="protocol" class="input proto" type="text" spellcheck="false" placeholder="subprotocol"/>
      <select id="method" class="select method hidden" title="HTTP 方法">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="DELETE">DELETE</option>
        <option value="PATCH">PATCH</option>
        <option value="HEAD">HEAD</option>
        <option value="OPTIONS">OPTIONS</option>
      </select>
      <label id="reconnectWrap" class="check"><input id="reconnect" type="checkbox" checked/> 重连</label>
      <label id="redirectWrap" class="check hidden"><input id="followRedirects" type="checkbox" checked/> 重定向</label>
      <button id="btnToggle" class="btn primary" type="button">连接</button>
      <button id="btnSendTop" class="btn primary hidden" type="button">发送</button>
      <button id="btnRecord" class="btn ghost" type="button" title="保存到左侧接口，不发送">记录</button>
      <div id="state" class="state idle">idle</div>
      <div id="modeSwitch" class="mode-switch" role="tablist" aria-label="工作模式">
        <button id="btnModeDoc" class="mode-btn on" type="button" data-mode="doc" role="tab" aria-selected="true">文档</button>
        <button id="btnModeDebug" class="mode-btn" type="button" data-mode="debug" role="tab" aria-selected="false">调试</button>
      </div>
      <button id="btnHistory" class="btn ghost bar-btn" type="button" title="历史会话">历史</button>
      <button id="btnTheme" class="btn ghost bar-btn" type="button" title="切换主题">深色</button>
    </header>
    <div id="catalogTip" class="catalog-tip" hidden></div>

    <!-- history banner -->
    <div id="histBanner" class="hist-banner hidden">
      <span id="histLabel">历史模式</span>
      <button id="btnLive" class="btn ghost" type="button">返回实时</button>
    </div>

    <!-- main -->
    <main class="main">
      <aside id="catalogPane" class="catalog-pane">
        <div class="pane-head">
          <button id="btnCatalogToggle" class="btn ghost bar-btn btn-icon catalog-toggle" type="button" title="收起接口目录" aria-label="收起接口目录">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 3.2L5.4 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span id="catalogTitle">接口</span>
          <div class="pane-actions">
            <input id="catalogFilter" class="input search-inline catalog-filter" type="search" spellcheck="false" placeholder="搜索全部主机…"/>
            <button id="btnCatalogExport" class="btn ghost bar-btn btn-icon" type="button" title="导出当前主机接口" aria-label="导出当前主机接口">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6v7.2M5.2 7.4L8 10.4l2.8-3M3.2 13.2h9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btnCatalogImport" class="btn ghost bar-btn btn-icon" type="button" title="导入本机目录或 Postman Collection（按文件里的主机）" aria-label="导入本机目录或 Postman Collection">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.2V3M5.2 5.6L8 2.6l2.8 3M3.2 13.2h9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btnCatalogAdd" class="btn ghost bar-btn btn-icon" type="button" title="新建接口" aria-label="新建接口">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.75v10.5M2.75 8h10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div id="catalogList" class="catalog-list"></div>
      </aside>
      <section id="docPane" class="doc-pane">
        <div class="pane-head">
          <span id="docHeadTitle">接口详情</span>
        </div>
        <div id="docEmpty" class="doc-empty">从左侧选择一个接口，查看并编辑说明、请求和返回示例。</div>
        <div id="docBody" class="doc-body hidden">
          <div id="docMeta" class="doc-meta"></div>
          <div id="docSummary" class="doc-summary"></div>
          <div id="docExtra" class="doc-extra"></div>
          <div class="doc-cols">
            <div class="doc-col">
              <div class="doc-col-head">
                <span>请求</span>
                <div class="pane-actions">
                  <button id="btnCopyDocReq" class="btn ghost" type="button" title="复制请求">复制</button>
                </div>
              </div>
              <textarea id="docReq" class="doc-block doc-edit" spellcheck="false" placeholder="请求体，可直接改"></textarea>
            </div>
            <div class="doc-col">
              <div class="doc-col-head">
                <span>返回示例</span>
                <div class="pane-actions">
                  <button id="btnCopyDocRes" class="btn ghost" type="button" title="复制返回示例">复制</button>
                </div>
              </div>
              <textarea id="docRes" class="doc-block doc-edit" spellcheck="false" placeholder="返回示例，可直接改"></textarea>
            </div>
          </div>
        </div>
      </section>
      <section class="list-pane">
        <div id="reqPane" class="req-pane hidden">
          <div class="pane-head">
            <span>请求</span>
            <div class="pane-actions">
              <button id="btnClearCookies" class="btn ghost" type="button" title="清除此主机本次会话的 Cookie">清 Cookie</button>
              <button id="btnCurl" class="btn ghost" type="button" title="复制当前请求为 cURL">cURL</button>
              <button id="btnFormatHttp" class="btn ghost" type="button">格式化</button>
              <button id="btnSaveReq" class="btn ghost" type="button" title="保存当前接口，不发送（Ctrl+S）">保存</button>
            </div>
          </div>
          <div id="reqBuilder" class="req-builder">
            <div id="reqMeta" class="req-meta">
              <div class="req-meta-row">
                <input id="reqTitle" class="input req-meta-title" type="text" spellcheck="false" maxlength="80"
                       placeholder="标题，例如 登录"/>
                <div id="moduleWrap" class="module-wrap">
                  <input id="reqModule" class="input req-meta-module" type="text" spellcheck="false" maxlength="80"
                         placeholder="模块" autocomplete="off" aria-autocomplete="list"
                         aria-controls="moduleMenu" aria-expanded="false"/>
                  <div id="moduleMenu" class="saved-menu module-menu hidden" role="listbox" aria-hidden="true"></div>
                </div>
              </div>
              <input id="reqDesc" class="input req-meta-desc" type="text" spellcheck="false" maxlength="200"
                     placeholder="描述（可选）"/>
            </div>
            <div id="reqTabs" class="req-tabs">
              <button type="button" class="req-tab" data-tab="params">参数</button>
              <button type="button" class="req-tab" data-tab="headers">请求头</button>
              <button type="button" class="req-tab" data-tab="auth">鉴权</button>
              <button type="button" class="req-tab on" data-tab="body">请求体</button>
            </div>
            <div id="tabParams" class="req-panel hidden">
              <div id="paramRows" class="kv-list"></div>
            </div>
            <div id="tabHeaders" class="req-panel hidden">
              <div id="headerRows" class="kv-list"></div>
            </div>
            <div id="tabAuth" class="req-panel hidden">
              <div class="auth-row">
                <select id="authType" class="select">
                  <option value="none">No Auth</option>
                  <option value="bearer">Bearer Token</option>
                  <option value="basic">Basic Auth</option>
                </select>
                <input id="authToken" class="input hidden" type="text" spellcheck="false" placeholder="Token"/>
                <input id="authUser" class="input hidden" type="text" spellcheck="false" placeholder="Username"/>
                <input id="authPass" class="input hidden" type="password" placeholder="Password"/>
              </div>
            </div>
            <div id="tabBody" class="req-panel">
              <div class="body-types">
                <label><input type="radio" name="bodyType" value="none"/> none</label>
                <label><input type="radio" name="bodyType" value="json" checked/> json</label>
                <label><input type="radio" name="bodyType" value="text"/> text</label>
                <label><input type="radio" name="bodyType" value="form"/> x-www-form-urlencoded</label>
              </div>
              <div id="formRows" class="kv-list hidden"></div>
            </div>
          </div>
        </div>
        <div class="pane-head">
          <span id="listTitle">消息</span>
          <div class="pane-actions">
            <input id="msgFilter" class="input search-inline" type="search" spellcheck="false" placeholder="过滤消息…"/>
            <button id="btnClear" class="btn ghost" type="button">清空</button>
          </div>
        </div>
        <div id="list" class="list"></div>
      </section>
      <section class="detail-pane">
        <div class="pane-head">
          <span id="detailTitle">详情</span>
          <div class="pane-actions">
            <button id="btnCurlDetail" class="btn ghost hidden" type="button" title="复制为 cURL">cURL</button>
            <button id="btnCopyDetail" class="btn ghost hidden" type="button" title="复制这条详情">复制</button>
            <button id="btnFill" class="btn ghost hidden" type="button" title="把这条发送填回请求栏">填回</button>
          </div>
        </div>
        <div id="detail" class="detail empty">选择一条消息</div>
      </section>
    </main>

    <!-- composer -->
    <footer class="composer">
      <div id="payloadWrap" class="payload-wrap">
        <div id="payloadOutCol" class="payload-col">
          <div class="payload-col-head">发送</div>
          <textarea id="payload" class="payload" rows="12" spellcheck="false" placeholder='{"cmd":"ping"}  ·  Ctrl+Enter 发送'></textarea>
        </div>
        <div id="payloadInCol" class="payload-col">
          <div class="payload-col-head">返回</div>
          <textarea id="payloadIn" class="payload payload-in" rows="12" spellcheck="false" placeholder="这条接口记录的返回信令"></textarea>
        </div>
      </div>
      <div class="composer-actions">
        <button id="btnSaveWS" class="btn ghost" type="button" title="保存当前发送，不发送（Ctrl+S）">保存</button>
        <button id="btnFormat" class="btn ghost" type="button">格式化</button>
        <button id="btnResend" class="btn ghost" type="button">重发</button>
        <button id="btnSend" class="btn primary" type="button">发送</button>
      </div>
      <div id="footer" class="footer-meta"></div>
    </footer>
  </div>

  <!-- confirm modal -->
  <div id="confirmModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card confirm-card">
      <div class="modal-head">
        <span id="confirmTitle">确认</span>
      </div>
      <div class="confirm-body">
        <div id="confirmMsg"></div>
      </div>
      <div class="record-foot">
        <button id="btnConfirmCancel" class="btn ghost" type="button">取消</button>
        <button id="btnConfirmOk" class="btn danger" type="button">删除</button>
      </div>
    </div>
  </div>

  <!-- text prompt modal -->
  <div id="promptModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card url-card">
      <div class="modal-head">
        <span id="promptTitle">输入</span>
      </div>
      <div class="url-modal-body">
        <div id="promptHint" class="url-modal-hint"></div>
        <input id="promptInput" class="input url-modal-input" type="text" spellcheck="false"
               autocomplete="off" autocapitalize="off" autocorrect="off"/>
        <div id="promptErr" class="record-err"></div>
      </div>
      <div class="record-foot">
        <button id="btnPromptCancel" class="btn ghost" type="button">取消</button>
        <button id="btnPromptOk" class="btn primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- add url modal -->
  <div id="urlModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card url-card">
      <div class="modal-head">
        <span id="urlModalTitle">增加地址</span>
        <div class="pane-actions">
          <button id="btnUrlModalClose" class="btn ghost" type="button">关闭</button>
        </div>
      </div>
      <div class="url-modal-body">
        <div class="url-modal-hint">填写完整 URL，例如 ws://10.0.0.1:8080/path 或 https://example.com/api</div>
        <input id="urlModalInput" class="input url-modal-input" type="text" spellcheck="false"
               autocomplete="off" autocapitalize="off" autocorrect="off"
               placeholder="ws://host:port/path  或  https://host/path"/>
        <div id="urlModalErr" class="record-err"></div>
      </div>
      <div class="record-foot">
        <button id="btnUrlModalCancel" class="btn ghost" type="button">取消</button>
        <button id="btnUrlModalOk" class="btn primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- history modal -->
  <div id="histModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <span>历史会话</span>
        <div class="pane-actions">
          <button id="btnOpenLogDir" class="btn ghost" type="button">打开目录</button>
          <button id="btnPickSession" class="btn ghost" type="button">打开文件…</button>
          <button id="btnHistRefresh" class="btn ghost" type="button">刷新</button>
          <button id="btnHistClose" class="btn ghost" type="button">关闭</button>
        </div>
      </div>
      <div class="hist-search-bar">
        <input id="histSearch" class="input hist-search" type="search" spellcheck="false"
               placeholder="关键字搜索：日期 / IP / 域名 / URL / 消息…"/>
      </div>
      <div id="histList" class="hist-list"></div>
      <div id="histEmpty" class="hist-empty hidden">暂无按天日志（ws-YYYY-MM-DD.jsonl），发送或连接后会自动生成</div>
    </div>
  </div>

  <!-- manual record modal -->
  <div id="recordModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card record-card">
      <div class="modal-head">
        <span id="recordTitle">手动记录</span>
        <div class="pane-actions">
          <button id="btnRecordClose" class="btn ghost" type="button">关闭</button>
        </div>
      </div>
      <div id="recordHint" class="record-hint">不会发送，保存到左侧接口。</div>
      <div id="recordMeta" class="record-meta"></div>
      <div id="recordWS" class="record-body record-ws">
        <div class="record-col">
          <div class="record-col-head">
            <span>发送</span>
            <button id="btnFmtRecOut" class="btn ghost" type="button">格式化</button>
          </div>
          <textarea id="recOut" class="record-text" spellcheck="false" placeholder='{"cmd":"ping"}'></textarea>
        </div>
        <div class="record-col">
          <div class="record-col-head">
            <span>返回</span>
            <button id="btnFmtRecIn" class="btn ghost" type="button">格式化</button>
          </div>
          <textarea id="recIn" class="record-text" spellcheck="false" placeholder='{"ok":true}'></textarea>
        </div>
      </div>
      <div id="recordHTTP" class="record-body record-http hidden">
        <div class="record-col">
          <div class="record-col-head">
            <span>请求体</span>
            <button id="btnFmtRecReq" class="btn ghost" type="button">格式化</button>
          </div>
          <textarea id="recReqBody" class="record-text" spellcheck="false" placeholder='{"name":"demo"}'></textarea>
        </div>
        <div class="record-col">
          <div class="record-col-head">
            <span>响应体</span>
            <button id="btnFmtRecRes" class="btn ghost" type="button">格式化</button>
          </div>
          <textarea id="recResBody" class="record-text" spellcheck="false" placeholder='{"ok":true}'></textarea>
        </div>
      </div>
      <div class="record-foot">
        <div id="recordErr" class="record-err"></div>
        <button id="btnRecordCancel" class="btn ghost" type="button">取消</button>
        <button id="btnRecordSave" class="btn primary" type="button">保存到接口</button>
      </div>
    </div>
  </div>

  <div id="groupMenu" class="saved-menu group-menu hidden" role="menu" aria-hidden="true"></div>

  <script src="./src/main.js" type="module"></script>
</body>
</html>
